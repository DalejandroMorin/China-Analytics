[tool.poetry]
name = "china-analytics"
version = "0.1.0"
description = "China Analytics API"
authors = ["Tu Nombre <tu@email.com>"]

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
fastapi = "0.104.1"
uvicorn = {extras = ["standard"], version = "0.24.0"}
sqlalchemy = "2.0.23"
pydantic = "2.5.0"
pandas = "2.2.1"
numpy = "1.26.2"
scikit-learn = "1.3.2"
scipy = "1.11.4"
python-multipart = "0.0.6"

[build-system]
requires = ["poetry-core"]
